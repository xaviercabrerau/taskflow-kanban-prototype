version: '3.9'

services:
  # PostgreSQL (if not using Supabase cloud)
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: ${SUPABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${SUPABASE_PASSWORD:-postgres}
      POSTGRES_DB: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SUPABASE_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana for dashboards and visualization
  grafana:
    image: grafana/grafana:11.0.0
    container_name: taskflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_INSTALL_PLUGINS: 'grafana-piechart-panel'
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_COOKIE_SAMESITE: 'Lax'
      GF_SERVER_PROTOCOL: http
      GF_SERVER_DOMAIN: localhost:3001
      GF_SERVER_ROOT_URL: http://localhost:3001/
      GF_DATE_FORMAT: YYYY-MM-DD HH:mm:ss
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for metrics collection (optional, for advanced monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:

networks:
  default:
    name: taskflow-network
